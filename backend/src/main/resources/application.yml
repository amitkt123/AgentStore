server:
  forward-headers-strategy: ${AGENTSTORE_FORWARD_HEADERS:none}   # set to native behind a trusted proxy so client IPs are real
spring:
  application:
    name: agent-store-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/agentstore
    username: agentstore
    password: agentstore
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${agentstore.data.max-file-size:50MB}
      max-request-size: ${agentstore.data.max-request-size:51MB}
  threads:
    virtual:
      enabled: true      # a long-polling agent (GET /runtime/v1/gates/{id}?wait=) must not tie up a platform thread
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

agentstore:
  money:
    platform-fee-percent: 20
    billing-mode: PREPAID
    postpaid-default-credit-limit: 50000.00
    tds:
      enabled: false
      rate: 0.001
      rate-no-pan: 0.05
    gst-tcs:
      enabled: false
      rate: 0.01
    payments:
      provider: razorpay
      methods: UPI,CARD,NETBANKING,BANK_TRANSFER
      topup-min: 100.00
      topup-daily-limit: 100000.00
      refund-window-days: 180
      bill-due-days: 15
      webhook-rate-per-minute: 120
      razorpay:
        key-id: ${RAZORPAY_KEY_ID:}
        key-secret: ${RAZORPAY_KEY_SECRET:}
        webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
        base-url: https://api.razorpay.com
      fake:
        webhook-secret: fake-webhook-secret
  data:
    retention-interval: PT1H
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef-0123456789}
    expiration-minutes: 60
  identity:
    admin-emails: ${ADMIN_EMAILS:}
    refresh-token-ttl: P30D
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  web:
    base-url: ${WEB_BASE_URL:http://localhost:3000}
  email:
    mode: ${EMAIL_MODE:log}          # log | smtp
    from: ${EMAIL_FROM:Karya <no-reply@karya.example>}
  secrets:
    encryption-key-base64: ${SECRET_ENCRYPTION_KEY}   # no default: required outside the dev and test profiles
  callback:
    base-url: ${CALLBACK_BASE_URL:http://localhost:8080}
  runtime:
    redis-uri: ${REDIS_URI:redis://localhost:6379}
    legacy-callback:
      enabled: ${AGENTSTORE_LEGACY_CALLBACK_ENABLED:true}
    rate-limit:
      per-minute: 600
      logs-per-minute: 120
      llm-per-minute: 60
  jobs:
    enabled: ${AGENTSTORE_JOBS_ENABLED:true}
  notifications:
    email-interval: PT30S
  runs:
    gate-timeout: PT30M
    reaper-interval: PT30S
    agent-command: ${AGENTSTORE_RUNS_AGENT_COMMAND:/workspace/app/agentstore-entrypoint}
  runner:
    base-url: ${RUNNER_BASE_URL:http://localhost:8090}
    secret: ${RUNNER_SECRET:}
    connect-timeout: PT5S
    # Worst-case create is the vendor backend's REST call (30s) + the runner's agent start (60s);
    # Spring must outlast both.
    read-timeout: PT120S
    backend: ${RUNNER_BACKEND:e2b}      # recorded on each build; a mismatch at run time triggers a rebuild
    build-read-timeout: PT30S
  builds:
    poll-interval: PT5S
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:8333}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:agentstore-dev}
    secret-key: ${STORAGE_SECRET_KEY:agentstore-dev-secret-change-me}
    bucket: ${STORAGE_BUCKET:agentstore}
  sandbox:
    quota:
      unverified:
        run-seconds: 7200
        concurrent-runs: 1
        llm-spend: 200
        fixture-bytes: 524288000
        builds-per-day: 20
      verified:
        run-seconds: 60000
        concurrent-runs: 5
        llm-spend: 2000
        fixture-bytes: 5368709120
        builds-per-day: 100
  llm:
    max-tokens-per-run-limit: 5000000
    max-output-tokens: 32000
    recording-ttl: P14D
    retention-interval: PT1H
    retry-backoff: PT0.25S
    connect-timeout: PT5S
    read-timeout: PT120S
    breaker:
      window-size: 20
      minimum-calls: 10
      failure-rate-percent: 50
      open-duration: PT30S
    providers:
      anthropic:
        base-url: https://api.anthropic.com
        api-key: ${ANTHROPIC_API_KEY:}
      openai:
        base-url: https://api.openai.com
        api-key: ${OPENAI_API_KEY:}

springdoc:
  paths-to-match: /runtime/v1/**
  api-docs:
    version: openapi_3_1
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false
