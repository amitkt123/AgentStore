# Local development profile. Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Secrets and per-machine values live in backend/.env (git-ignored, copy from .env.example).
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/agentstore
    username: agentstore
    password: ${DB_PASSWORD:agentstore}
agentstore:
  money:
    payments:
      provider: fake
      fake:
        webhook-secret: fake-webhook-secret
    payouts:
      provider: fake
      fake:
        webhook-secret: fake-payout-webhook-secret
  secrets:
    # dev-only all-zero key; real environments must set SECRET_ENCRYPTION_KEY
    encryption-key-base64: ${SECRET_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
