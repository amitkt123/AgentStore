name: CI Pipeline

on:
  # PRs only: runs when a PR is opened, reopened or gets new commits; not on merges or plain branch pushes
  pull_request:
    branches: [master]

# A newer push to the same PR cancels the older run
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Integration tests use Testcontainers; the hosted runner ships with Docker
      - name: Test
        working-directory: backend
        run: mvn -B -ntp clean test

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: runner/pom.xml
      - name: Test
        working-directory: runner
        run: mvn -B -ntp clean test

  e2b-shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runner/e2b-shim/package-lock.json
      - name: Test
        working-directory: runner/e2b-shim
        run: |
          npm ci
          npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Typecheck, test and build
        working-directory: cli
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
