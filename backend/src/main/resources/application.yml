spring:
  application:
    name: agent-store-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/agentstore
    username: agentstore
    password: agentstore
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

agentstore:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef-0123456789}
    expiration-minutes: 60
  identity:
    admin-emails: ${ADMIN_EMAILS:}
    refresh-token-ttl: P30D
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  web:
    base-url: ${WEB_BASE_URL:http://localhost:3000}
  email:
    mode: ${EMAIL_MODE:log}          # log | smtp
    from: ${EMAIL_FROM:Karya <no-reply@karya.example>}
  secrets:
    encryption-key-base64: ${SECRET_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  callback:
    base-url: ${CALLBACK_BASE_URL:http://localhost:8080}
  jobs:
    enabled: ${AGENTSTORE_JOBS_ENABLED:true}
  runs:
    gate-timeout: PT30M
    reaper-interval: PT30S
    agent-command: ${AGENTSTORE_RUNS_AGENT_COMMAND:/workspace/app/agentstore-entrypoint}
  runner:
    base-url: ${RUNNER_BASE_URL:http://localhost:8090}
    secret: ${RUNNER_SECRET:}
    connect-timeout: PT5S
    # Worst-case create is the vendor backend's REST call (30s) + the runner's agent start (60s);
    # Spring must outlast both.
    read-timeout: PT120S
    backend: ${RUNNER_BACKEND:e2b}      # recorded on each build; a mismatch at run time triggers a rebuild
    build-read-timeout: PT30S
  builds:
    poll-interval: PT5S
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:8333}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:agentstore-dev}
    secret-key: ${STORAGE_SECRET_KEY:agentstore-dev-secret-change-me}
    bucket: ${STORAGE_BUCKET:agentstore}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false
