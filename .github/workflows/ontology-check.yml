name: Ontology staleness check

on:
  pull_request:
    paths:
      - "**.java"
      - "**.ts"
      - "**.json"
      - "**.yml"
      - "ONTOLOGY.md"

jobs:
  check-ontology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check ONTOLOGY.md is up to date
        run: |
          chmod +x scripts/check-ontology-staleness.sh
          scripts/check-ontology-staleness.sh ONTOLOGY.md
        continue-on-error: true

      - name: Comment on PR if stale
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "⚠️ `ONTOLOGY.md` appears stale relative to files it tracks. Consider re-running the ontology generation prompt and re-stamping before merge."
            })
